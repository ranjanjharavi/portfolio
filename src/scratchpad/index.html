<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f4" />
    <script src="../shared/theme.js"></script>
    <title>Folio | Scratchpad</title>

    <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet" />

    <!-- CDN Libraries: Marked (GFM) and DOMPurify -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@16.4.2/lib/marked.umd.js" crossorigin="anonymous"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js"
      crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../folio/folio.css" />
    <link rel="stylesheet" href="./scratchpad.css" />
  </head>
  <body>
    <a class="skip-link" href="#doc-stage">Skip to document</a>
    <header class="folio-masthead">
      <div class="folio-masthead-inner">
        <div class="folio-brand">
          <a class="folio-mark" href="../" aria-label="Folio, portfolio">
            <span class="folio-dot"></span>
            Folio
          </a>
          <span class="folio-tool-name">Scratchpad</span>
        </div>
        <div class="folio-masthead-tools">
          <nav class="folio-nav" aria-label="Related tools"><a href="../mermaid/">Diagrams</a></nav>
          <label class="global-search">
            <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#search" /></svg>
            <span class="sr-only">Search across all documents and notes</span>
            <input
              id="global-search"
              type="search"
              placeholder="Search all documents &amp; notes..."
              autocomplete="off" />
          </label>
          <span class="storage-pill" title="All documents and notes are stored locally in your browser's IndexedDB">
            <span class="folio-dot"></span>
            <span id="db-status-text">IndexedDB Ready</span>
          </span>
          <button id="theme-toggle" class="folio-theme-toggle" type="button" aria-label="Switch to dark theme" hidden>
            <svg class="folio-theme-icon theme-moon" aria-hidden="true"><use href="../shared/icons.svg#moon" /></svg>
            <svg class="folio-theme-icon theme-sun" aria-hidden="true"><use href="../shared/icons.svg#sun" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="shell">
      <p id="dependency-status" class="dependency-error" role="alert" hidden></p>

      <div class="workspace">
        <!-- Left Rail: Documents -->
        <aside class="doc-rail" aria-label="Documents">
          <div class="rail-header">
            <div class="rail-title-row">
              <h2>Documents</h2>
              <span id="doc-total" class="rail-count"></span>
            </div>
            <form id="new-doc-form" class="new-doc-form" autocomplete="off">
              <label for="new-doc-title" class="sr-only">New document title</label>
              <input id="new-doc-title" type="text" maxlength="90" placeholder="New scratch document..." required />
              <button type="submit" class="primary" aria-label="Create document" data-tooltip="Create document">
                <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#plus" /></svg>
                New
              </button>
            </form>
          </div>

          <div class="rail-FilterBar">
            <span>Pinned on top</span>
            <label>
              Sort
              <select id="doc-sort">
                <option value="updated">Recently active</option>
                <option value="created">Newest created</option>
                <option value="title">Title A–Z</option>
              </select>
            </label>
          </div>

          <ul id="doc-list" class="doc-list" aria-label="Saved documents"></ul>
        </aside>

        <!-- Right Stage: Active Document + Note Composer + Timeline -->
        <section id="doc-stage" class="doc-stage" aria-label="Selected document workspace" tabindex="-1"></section>
      </div>

      <output id="status" class="status-bar" aria-live="polite" aria-atomic="true"></output>
    </main>

    <!-- Confirmation Dialog (Discard Draft / Delete Note / Delete Document) -->
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-copy">
      <h2 id="confirm-title">Confirm action</h2>
      <p id="confirm-copy"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button" data-action="confirm-cancel" autofocus>Cancel</button>
        <button id="confirm-accept" type="button" class="danger-solid" data-action="confirm-accept">Confirm</button>
      </div>
    </dialog>

    <!-- Rename Document Dialog -->
    <dialog id="rename-dialog" aria-labelledby="rename-heading">
      <h2 id="rename-heading">Rename document</h2>
      <form id="rename-form" class="dialog-form">
        <label for="rename-input">Document title</label>
        <input id="rename-input" type="text" maxlength="90" required autocomplete="off" />
        <p id="rename-error" role="alert"></p>
        <div class="confirm-actions">
          <button type="button" data-action="cancel-rename">Cancel</button>
          <button type="submit" class="primary">Save title</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
